<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Brand Gradient 1: Indigo to Electric Blue -->
    <linearGradient id="dbmap-grad-primary" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Gradient 2: Map Pin Accent -->
    <linearGradient id="dbmap-grad-accent" x1="24" y1="4" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Cylinder Top Shimmer -->
    <linearGradient id="dbmap-grad-cap" x1="8" y1="8" x2="30" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Shadow Filter -->
    <filter id="dbmap-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Base Badge Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#dbmap-grad-primary)" />

  <!-- Map Grid & Folding Geometry Overlay (Light Strokes) -->
  <path
    d="M10 12 L20 8 L30 12 L40 8 V36 L30 40 L20 36 L10 40 Z"
    stroke="#ffffff"
    stroke-opacity="0.22"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M20 8 V36 M30 12 V40"
    stroke="#ffffff"
    stroke-opacity="0.18"
    stroke-width="1.2"
    stroke-dasharray="2 2"
  />

  <!-- Database Cylinder Layer 1 (Top Cap) -->
  <ellipse cx="20" cy="15" rx="11" ry="4.5" fill="url(#dbmap-grad-cap)" stroke="#ffffff" stroke-width="1.4" />

  <!-- Database Cylinder Layer 1 (Body) -->
  <path
    d="M9 15 V20 C9 22.5 13.9 24.5 20 24.5 C26.1 24.5 31 22.5 31 20 V15"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Database Cylinder Layer 2 (Middle) -->
  <path
    d="M9 21 V26 C9 28.5 13.9 30.5 20 30.5 C26.1 30.5 31 28.5 31 26 V21"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Database Cylinder Layer 3 (Bottom) -->
  <path
    d="M9 27 V32 C9 34.5 13.9 36.5 20 36.5 C26.1 36.5 31 34.5 31 32 V27"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Interactive Database Schema Relational Map Nodes (Connecting Lines) -->
  <path
    d="M28 15 C33 13, 35 18, 36 21"
    stroke="url(#dbmap-grad-accent)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-dasharray="1 1"
  />

  <!-- Map Location Pin & Target Node Accent Badge (Bottom Right Overlay) -->
  <g filter="url(#dbmap-shadow)">
    <!-- Map Pin Outer Shield -->
    <path
      d="M36 18 C31.5 18, 28 21.5, 28 26 C28 31.5, 36 38, 36 38 C36 38, 44 31.5, 44 26 C44 21.5, 40.5 18, 36 18 Z"
      fill="url(#dbmap-grad-accent)"
      stroke="#ffffff"
      stroke-width="1.4"
    />
    <!-- Inner Pin Target Center Node -->
    <circle cx="36" cy="25.5" r="3" fill="#ffffff" />
    <circle cx="36" cy="25.5" r="1.3" fill="#f43f5e" />
  </g>
</svg>
